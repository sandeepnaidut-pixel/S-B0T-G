<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S-B0T</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { 
      font-family: 'VT323', monospace; 
      background-color: black; 
      color: white; 
      overflow: hidden; 
      height: 100dvh; 
      margin: 0;
    }
    .hard-shadow { box-shadow: 4px 4px 0px 0px #ffffff; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: black; border-left: 2px solid white; }
    ::-webkit-scrollbar-thumb { background: white; }
    input:focus, button:focus { outline: none; }
  </style>
</head>
<body class="flex flex-col relative">

  <!-- Header -->
  <header class="border-b-4 border-white p-4 flex justify-between items-center bg-black z-10 shrink-0">
    <div class="flex items-center gap-4">
      <div class="border-2 border-white p-1 hard-shadow">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
          <rect x="4" y="8" width="16" height="12" />
          <rect x="8" y="4" width="8" height="4" />
          <rect x="7" y="12" width="2" height="2" fill="black"/>
          <rect x="15" y="12" width="2" height="2" fill="black"/>
          <rect x="10" y="16" width="4" height="2" fill="black"/>
        </svg>
      </div>
      <div>
        <h1 class="text-3xl font-bold leading-none tracking-widest">S-B0T</h1>
        <p class="text-sm tracking-widest" id="authStatus">ONLINE_</p>
      </div>
    </div>
    <div class="flex gap-4">
      <button onclick="exportLog()" class="border-2 border-white p-2 hover:bg-white hover:text-black">DOC</button>
      <button onclick="toggleConfig()" class="border-2 border-white p-2 hover:bg-white hover:text-black">SYS</button>
    </div>
  </header>

  <!-- Chat Log -->
  <main id="chatLog" class="flex-1 overflow-y-auto p-4 pb-24 flex flex-col gap-4 relative text-xl leading-tight tracking-wide">
  </main>

  <!-- Input Area -->
  <footer class="absolute bottom-0 left-0 w-full bg-black border-t-4 border-white p-4 pb-[env(safe-area-inset-bottom)] shrink-0">
    <div class="flex gap-2">
      <button onclick="startVoice()" class="border-2 border-white p-2 shrink-0 hover:bg-white hover:text-black focus:bg-white focus:text-black">MIC</button>
      <input type="text" id="userInput" placeholder="> Input command..." class="flex-1 bg-black border-2 border-white p-2 text-white placeholder-gray-400">
      <button onclick="sendMessage()" class="border-2 border-white px-4 py-2 shrink-0 hard-shadow hover:bg-white hover:text-black focus:bg-white focus:text-black">EXE</button>
    </div>
  </footer>

  <!-- Config Modal -->
  <div id="configModal" class="hidden absolute inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4">
    <div class="border-4 border-white bg-black p-6 w-full max-w-md hard-shadow">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl">> SYS_CONFIG</h2>
        <button onclick="toggleConfig()" class="border-2 border-white px-2 hover:bg-white hover:text-black">X</button>
      </div>
      
      <label class="block mb-2 text-lg">GEMINI API KEY</label>
      <input type="password" id="geminiKey" class="w-full bg-black border-2 border-white p-2 mb-4 text-white">
      
      <label class="block mb-2 text-lg">GOOGLE OAUTH CLIENT ID</label>
      <input type="text" id="googleClient" class="w-full bg-black border-2 border-white p-2 mb-6 text-white">
      
      <button onclick="saveConfig()" class="w-full border-2 border-white p-2 mb-4 hover:bg-white hover:text-black text-xl">SAVE_CONFIG</button>
      <button onclick="wipeMemory()" class="w-full border-2 border-white border-dashed p-2 hover:bg-white hover:text-black text-xl text-gray-400">WIPE_LOCAL_MEMORY</button>
    </div>
  </div>

  <script>
    const chatLog = document.getElementById('chatLog');
    const userInput = document.getElementById('userInput');
    const configModal = document.getElementById('configModal');
    
    let tokenClient;
    let oauthToken = localStorage.getItem('oauthToken') || null;
    let pendingEvent = null;
    let chatHistory = JSON.parse(localStorage.getItem('chatHistory') || '[]');

    // Initialization
    window.onload = () => {
      renderHistory();
      if (localStorage.getItem('googleClient')) {
        initGoogle();
      }
      if (chatHistory.length === 0) {
        addMessage("S-B0T", "SYSTEM READY. AWAITING INPUT.");
      }
    };

    function toggleConfig() {
      configModal.classList.toggle('hidden');
      document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';
      document.getElementById('googleClient').value = localStorage.getItem('googleClient') || '';
    }

    function saveConfig() {
      localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
      localStorage.setItem('googleClient', document.getElementById('googleClient').value);
      toggleConfig();
      initGoogle();
      addMessage("S-B0T", "SYSTEM CONFIGURATION SAVED.");
    }

    function wipeMemory() {
      localStorage.clear();
      chatHistory = [];
      chatLog.innerHTML = '';
      oauthToken = null;
      toggleConfig();
      addMessage("S-B0T", "MEMORY WIPED. SYSTEM REBOOTED.");
    }

    // Google Identity Services
    function initGoogle() {
      const clientId = localStorage.getItem('googleClient');
      if (!clientId) return;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/calendar.events',
        callback: (tokenResponse) => {
          oauthToken = tokenResponse.access_token;
          localStorage.setItem('oauthToken', oauthToken);
          document.getElementById('authStatus').innerText = "SYNC_ACTIVE";
          if (pendingEvent) executeScheduleFlow();
        }
      });
      if (oauthToken) document.getElementById('authStatus').innerText = "SYNC_ACTIVE";
    }

    function requireAuth(callback) {
      if (oauthToken) {
        callback();
      } else if (tokenClient) {
        tokenClient.requestAccessToken();
      } else {
        addMessage("S-B0T", "ERROR: GOOGLE OAUTH CLIENT ID MISSING. CONFIGURE SYSTEM.");
      }
    }

    // UI Updates
    function addMessage(sender, text, save = true) {
      const div = document.createElement('div');
      div.className = sender === "USER" 
        ? "border-2 border-white p-3 self-end text-right w-4/5 ml-auto" 
        : "border-2 border-white p-3 self-start border-dashed w-4/5 mr-auto";
      div.innerText = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      
      if (save) {
        chatHistory.push({ sender, text });
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
      }
    }

    // Voice Dictation
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    function startVoice() {
      if (!recognition) {
        addMessage("S-B0T", "ERROR: VOICE API NOT SUPPORTED IN THIS BROWSER.");
        return;
      }
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
      };
      recognition.start();
    }

    // Document Export
    function exportLog() {
      let text = "S-B0T DAILY LOG\\n\\n";
      chatHistory.forEach(m => { text += `[${m.sender}] ${m.text}\\n`; });
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `s-b0t_log_${new Date().toISOString().split('T')[0]}.txt`;
      a.click();
    }

    function renderHistory() {
      chatLog.innerHTML = '';
      chatHistory.forEach(msg => addMessage(msg.sender, msg.text, false));
    }

    // Core Logic
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      
      addMessage("USER", text);
      userInput.value = '';
      
      const apiKey = localStorage.getItem('geminiKey');
      if (!apiKey) {
        addMessage("S-B0T", "ERROR: GEMINI API KEY MISSING. CONFIGURE SYSTEM.");
        return;
      }

      const systemPrompt = `You are S-B0T, a harsh, concise scheduling assistant. Current local time: ${new Date().toLocaleString()}. Return dates in ISO 8601 format strictly WITHOUT the trailing 'Z' (e.g., YYYY-MM-DDTHH:mm:ss). Always return a JSON object with this exact structure. For chat: {"Action": "Chat", "Response": "text"}. For scheduling: {"Action": "Schedule", "EventName": "text", "StartTime": "YYYY-MM-DDTHH:mm:ss", "EndTime": "YYYY-MM-DDTHH:mm:ss"}. For deleting: {"Action": "Delete", "EventName": "text"}.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(rawText);

        if (parsed.Action === "Schedule") {
          pendingEvent = parsed;
          requireAuth(executeScheduleFlow);
        } else if (parsed.Action === "Delete") {
          requireAuth(() => deleteFromCalendar(parsed.EventName));
        } else {
          addMessage("S-B0T", parsed.Response.toUpperCase());
        }
      } catch (e) {
        addMessage("S-B0T", "ERROR: PROCESS FAILED. CHECK API KEY AND NETWORK.");
      }
    }

    // Schedule & Conflict Logic
    async function checkConflicts(startTime, endTime) {
      const startIso = new Date(startTime).toISOString();
      const endIso = new Date(endTime).toISOString();
      const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${startIso}&timeMax=${endIso}&singleEvents=true`, {
        headers: { 'Authorization': `Bearer ${oauthToken}` }
      });
      const data = await res.json();
      return data.items && data.items.length > 0;
    }

    async function executeScheduleFlow() {
      if (!pendingEvent) return;
      
      const hasConflict = await checkConflicts(pendingEvent.StartTime, pendingEvent.EndTime);
      if (hasConflict) {
        addMessage("S-B0T", `CONFLICT DETECTED. TIME SLOT ${pendingEvent.StartTime} OVERLAPS EXISTING RECORD. REQUEST NEW TIME.`);
        pendingEvent = null;
        return;
      }

      const div = document.createElement('div');
      div.className = "border-2 border-white p-3 self-start w-4/5 mr-auto";
      div.innerHTML = `
        <p class="mb-2">ACTION: SCHEDULE</p>
        <p class="mb-2">EVENT: ${pendingEvent.EventName.toUpperCase()}</p>
        <p class="mb-4">TIME: ${pendingEvent.StartTime}</p>
        <div class="flex gap-4">
          <button onclick="confirmSchedule(this.parentElement.parentElement)" class="border-2 border-white px-4 py-1 hover:bg-white hover:text-black w-full">CONFIRM</button>
          <button onclick="cancelSchedule(this.parentElement.parentElement)" class="border-2 border-white px-4 py-1 hover:bg-white hover:text-black w-full">CANCEL</button>
        </div>
      `;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function confirmSchedule(uiElement) {
      if (!pendingEvent) return;
      uiElement.remove();
      
      const eventBody = {
        summary: pendingEvent.EventName,
        start: { dateTime: pendingEvent.StartTime, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
        end: { dateTime: pendingEvent.EndTime, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }
      };
      
      try {
        const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${oauthToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(eventBody)
        });
        if (res.ok) {
          addMessage("S-B0T", `SUCCESS. "${pendingEvent.EventName.toUpperCase()}" WRITTEN TO CALENDAR.`);
        } else {
          addMessage("S-B0T", "ERROR: CALENDAR WRITE REJECTED.");
        }
      } catch (e) {
        addMessage("S-B0T", "ERROR: NETWORK FAILURE.");
      }
      pendingEvent = null;
    }

    function cancelSchedule(uiElement) {
      uiElement.remove();
      pendingEvent = null;
      addMessage("S-B0T", "ACTION CANCELLED.");
    }

    // Delete Logic
    async function deleteFromCalendar(eventName) {
      try {
        const searchResponse = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?q=${encodeURIComponent(eventName)}`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${oauthToken}` }
        });
        
        const searchData = await searchResponse.json();
        if (searchData.items && searchData.items.length > 0) {
          const eventId = searchData.items[0].id;
          await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${oauthToken}` }
          });
          addMessage("S-B0T", `SUCCESS. "${eventName.toUpperCase()}" PURGED FROM CALENDAR.`);
        } else {
          addMessage("S-B0T", `ERROR: RECORD "${eventName.toUpperCase()}" NOT FOUND.`);
        }
      } catch (error) {
        addMessage("S-B0T", "ERROR: DELETION PROTOCOL FAILED.");
      }
    }

    // Enter key support
    userInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
