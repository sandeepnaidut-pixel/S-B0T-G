<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S-B0T</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="S-B0T">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Retro Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }
        body, html {
            /* Applied VT323 retro font */
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            height: 100dvh; 
            width: 100vw;
            background-color: #000000; /* Strict Black */
            color: #ffffff; /* Strict White */
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            /* Boost font size globally since pixel fonts run small */
            font-size: 22px; 
        }
        
        .chat-scroll-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        
        /* Custom Retro Scrollbar */
        ::-webkit-scrollbar { width: 8px; border-left: 2px solid #ffffff; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background-color: #ffffff; }
        
        /* Message Entrance Animation */
        .message-enter {
            animation: slideIn 0.2s steps(4, end) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Retro Typing Indicator Animation */
        .typing-block { animation: blink 1s infinite steps(2, start); }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .chat-bubble {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        
        /* Retro hard shadow for distinct elements */
        .retro-shadow {
            box-shadow: 4px 4px 0px 0px #ffffff;
        }
    </style>
</head>

<body class="flex justify-center bg-black">

    <!-- Mobile container framing -->
    <div class="w-full max-w-md bg-black h-[100dvh] flex flex-col relative sm:border-x-2 sm:border-white">
        
        <!-- Header -->
        <header class="flex-shrink-0 bg-black border-b-2 border-white z-10 flex items-center justify-between px-5 py-3" style="padding-top: max(0.75rem, var(--safe-area-inset-top));">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 border-2 border-white flex items-center justify-center bg-black text-white retro-shadow">
                    <i class="fa-solid fa-robot text-xl"></i>
                </div>
                <div class="flex flex-col leading-none pt-1">
                    <h1 class="text-3xl uppercase tracking-widest m-0 p-0 leading-none">S-B0T</h1>
                    <p class="text-lg tracking-[0.2em] uppercase m-0 p-0 leading-none">Online_</p>
                </div>
            </div>
            <button id="settingsBtn" class="w-10 h-10 border-2 border-white hover:bg-white hover:text-black active:bg-gray-300 flex items-center justify-center text-white transition-colors retro-shadow">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </header>

        <!-- Chat Container (Starts Clean) -->
        <main id="chatContainer" class="flex-1 chat-scroll-container p-4 flex flex-col gap-6 pb-6">
            <!-- No default greeting block per requirements -->
        </main>

        <!-- Input Footer -->
        <footer class="flex-shrink-0 bg-black border-t-2 border-white z-10" style="padding-bottom: max(0.5rem, var(--safe-area-inset-bottom));">
            <form id="chatForm" class="p-3 flex items-end gap-3">
                <div class="flex-1 bg-black border-2 border-white flex items-center px-3 retro-shadow focus-within:bg-gray-900 transition-colors">
                    <textarea id="messageInput" rows="1" class="w-full bg-transparent resize-none outline-none py-3 max-h-[120px] text-2xl text-white placeholder-gray-400" placeholder="> Input command..." required></textarea>
                </div>
                <button type="submit" id="sendBtn" class="w-[54px] h-[54px] bg-black border-2 border-white retro-shadow flex-shrink-0 flex items-center justify-center text-white hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all disabled:opacity-50 disabled:active:translate-y-0 disabled:active:translate-x-0 disabled:active:shadow-[4px_4px_0px_0px_#ffffff]">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                </button>
            </form>
        </footer>

        <!-- Settings Modal -->
        <div id="settingsModal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col justify-center items-center p-4 transition-opacity opacity-0 duration-200">
            <div class="bg-black w-full max-w-sm border-2 border-white p-6 retro-shadow transform transition-transform scale-95 duration-200" id="settingsContent">
                <div class="flex justify-between items-center mb-6 border-b-2 border-white pb-3">
                    <h2 class="text-3xl uppercase tracking-widest">> CONFIG</h2>
                    <button id="closeSettingsBtn" class="text-white hover:bg-white hover:text-black w-8 h-8 border-2 border-white flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-xl text-white mb-2 uppercase tracking-widest">Gemini API Key</label>
                        <input type="password" id="apiKeyInput" class="w-full bg-black border-2 border-white px-3 py-3 outline-none focus:bg-gray-900 text-2xl" placeholder="AIzaSy...">
                        <p class="text-lg text-gray-400 mt-2 leading-tight">Stored locally. Required for AI processing.</p>
                    </div>
                    
                    <button id="saveSettingsBtn" class="w-full bg-black text-white uppercase text-2xl py-3 border-2 border-white retro-shadow hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all tracking-widest">
                        SAVE_KEY
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Toast Alert -->
        <div id="alertBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-black text-white px-5 py-3 border-2 border-white retro-shadow z-[100] transition-all duration-200 opacity-0 -translate-y-[150%] pointer-events-none flex items-center gap-3 w-max max-w-[90vw]">
            <i class="fa-solid fa-circle-exclamation text-xl"></i>
            <span id="alertMessage" class="text-2xl uppercase tracking-wide"></span>
        </div>
    </div>

    <script>
        // PWA Setup with Base64 SVG Icon (Black background, white text)
        const setupPWA = () => {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="black"/><text x="256" y="270" font-family="monospace" font-size="120" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">S-B0T</text></svg>`;
            const base64Icon = `data:image/svg+xml;base64,${btoa(svgIcon)}`;
            
            const manifest = {
                name: "S-B0T",
                short_name: "S-B0T",
                start_url: ".",
                display: "standalone",
                background_color: "#000000",
                theme_color: "#000000",
                icons: [{ src: base64Icon, sizes: "512x512", type: "image/svg+xml" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="icon" href="${base64Icon}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="apple-touch-icon" href="${base64Icon}">`);
        };
        setupPWA();

        // UI State & Elements
        let chatHistory = [];
        const UI = {
            chatContainer: document.getElementById('chatContainer'),
            chatForm: document.getElementById('chatForm'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsModal: document.getElementById('settingsModal'),
            settingsContent: document.getElementById('settingsContent'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            alertBox: document.getElementById('alertBox'),
            alertMessage: document.getElementById('alertMessage')
        };

        const showAlert = (message, duration = 3000) => {
            UI.alertMessage.textContent = message;
            UI.alertBox.classList.remove('opacity-0', '-translate-y-[150%]');
            UI.alertBox.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                UI.alertBox.classList.remove('opacity-100', 'translate-y-0');
                UI.alertBox.classList.add('opacity-0', '-translate-y-[150%]');
            }, duration);
        };

        // Textarea Auto-resize
        UI.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            UI.sendBtn.disabled = this.value.trim() === '';
        });

        UI.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(this.value.trim() !== '') UI.chatForm.dispatchEvent(new Event('submit'));
            }
        });

        const scrollToBottom = () => {
            requestAnimationFrame(() => {
                UI.chatContainer.scrollTop = UI.chatContainer.scrollHeight;
            });
        };

        // Settings Modal Handling
        const toggleSettings = (show) => {
            if (show) {
                UI.settingsModal.classList.remove('hidden');
                UI.settingsModal.style.display = 'flex';
                void UI.settingsModal.offsetWidth;
                UI.settingsModal.classList.remove('opacity-0');
                UI.settingsContent.classList.remove('scale-95');
                UI.settingsContent.classList.add('scale-100');
            } else {
                UI.settingsModal.classList.add('opacity-0');
                UI.settingsContent.classList.remove('scale-100');
                UI.settingsContent.classList.add('scale-95');
                setTimeout(() => {
                    UI.settingsModal.classList.add('hidden');
                    UI.settingsModal.style.display = 'none';
                }, 200);
            }
        };

        UI.settingsBtn.addEventListener('click', () => {
            UI.apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            toggleSettings(true);
        });
        
        UI.closeSettingsBtn.addEventListener('click', () => toggleSettings(false));
        UI.settingsModal.addEventListener('click', (e) => {
            if (e.target === UI.settingsModal) toggleSettings(false);
        });

        UI.saveSettingsBtn.addEventListener('click', () => {
            const key = UI.apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                showAlert('KEY_SAVED');
                toggleSettings(false);
            } else {
                showAlert('ERR: INVALID_KEY');
            }
        });

        const addMessageToUI = (text, isUser) => {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            
            // Strict retro black & white styling (Square borders, no rounding)
            if (isUser) {
                // User: Right aligned, white border, retro shadow
                bubble.className = `chat-bubble max-w-[85%] sm:max-w-[75%] px-4 py-2 text-2xl leading-[1.2] w-fit bg-black text-white border-2 border-white retro-shadow`;
            } else {
                // Bot: Left aligned, dashed white border to distinguish from user
                bubble.className = `chat-bubble max-w-[85%] sm:max-w-[75%] px-4 py-2 text-2xl leading-[1.2] w-fit bg-black text-white border-2 border-white border-dashed`;
            }
            
            let formattedText = text;
            if (!isUser) {
                // Simple bold markdown parsing -> map to underline/brackets for retro feel
                formattedText = text.replace(/\*\*(.*?)\*\*/g, '<span class="underline">$1</span>');
            }
            
            bubble.innerHTML = formattedText;
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        };

        const addTypingIndicator = () => {
            const wrapper = document.createElement('div');
            wrapper.id = 'typingIndicator';
            wrapper.className = `flex w-full message-enter justify-start`;
            
            const bubble = document.createElement('div');
            bubble.className = `px-4 py-3 bg-black border-2 border-white border-dashed flex items-center space-x-2 w-fit`;
            
            const block = document.createElement('div');
            block.className = 'w-3 h-5 bg-white typing-block';
            bubble.appendChild(block);
            
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
        };

        const removeTypingIndicator = () => {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        };

        const createGoogleCalendarLink = (event) => {
            const formatForUrl = (dateStr) => {
                const d = new Date(dateStr);
                return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
            };
            try {
                const start = formatForUrl(event.StartTime);
                const end = formatForUrl(event.EndTime);
                const title = encodeURIComponent(event.EventName);
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}`;
            } catch (e) {
                return "#";
            }
        };

        const renderEventCard = (event) => {
            const card = document.createElement('div');
            card.className = 'flex w-full message-enter justify-start mt-1 mb-2';
            
            const startDate = new Date(event.StartTime);
            const endDate = new Date(event.EndTime);
            
            const timeString = `${startDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} - ${endDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})}`;
            const dateString = startDate.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'}).toUpperCase();
            const calUrl = createGoogleCalendarLink(event);

            // Retro Event Card
            card.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[75%] bg-black border-2 border-white p-4 retro-shadow w-full">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 border-2 border-white flex items-center justify-center flex-shrink-0 bg-white text-black">
                            <i class="fa-regular fa-calendar-plus text-2xl"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-2xl text-white truncate leading-none uppercase mb-2">${event.EventName}</h4>
                            <p class="text-xl text-white leading-none mb-1">> DATE: ${dateString}</p>
                            <p class="text-xl text-white leading-none">> TIME: ${timeString}</p>
                        </div>
                    </div>
                    <a href="${calUrl}" target="_blank" class="mt-4 flex items-center justify-center gap-2 bg-black text-white border-2 border-white text-xl uppercase tracking-widest px-4 py-2 hover:bg-white hover:text-black active:bg-gray-300 transition-colors w-full text-center">
                        [ ADD_TO_CALENDAR ]
                    </a>
                </div>
            `;
            UI.chatContainer.appendChild(card);
            scrollToBottom();
        };

        const callGeminiAPI = async (userText) => {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                removeTypingIndicator();
                showAlert("ERR: API_KEY_MISSING");
                toggleSettings(true);
                return;
            }

            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            const currentDateTime = new Date().toLocaleString();
            
            // Explicitly instructing AI regarding event cancellations
            const systemPrompt = `You are S-B0T, a concise, highly efficient AI personal assistant. Current Date/Time context: ${currentDateTime}.
            1. Respond clearly and concisely to the user in a robotic/terminal-style tone.
            2. CRITICAL LIMITATION: You CANNOT cancel, delete, modify, or view existing events on the user's calendar. You only possess the ability to CREATE new events. If the user asks you to cancel, modify, or delete an event, you MUST politely explain that you lack read/delete permissions and that they must do it manually.
            3. IF the user asks to schedule something or create a new event, you MUST append a JSON block at the very end of your message formatted EXACTLY like this:
            \`\`\`json
            {
              "schedule": [
                {"EventName": "Task Title", "StartTime": "YYYY-MM-DDTHH:MM:SS", "EndTime": "YYYY-MM-DDTHH:MM:SS"}
              ]
            }
            \`\`\`
            Ensure the time strings are valid ISO 8601 format relative to the current date/time provided above. Do not hallucinate dates; use the context provided.`;

            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Request Failed");
                
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiText) {
                    processAIResponse(aiText);
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                }

            } catch (error) {
                removeTypingIndicator();
                addMessageToUI("ERR: CONNECTION_FAILED. Verify API key.", false);
            }
        };

        const processAIResponse = (rawText) => {
            removeTypingIndicator();
            const jsonRegex = /```json\n([\s\S]*?)\n```/;
            const match = rawText.match(jsonRegex);
            
            let displayString = rawText;
            let extractedEvents = null;

            if (match && match[1]) {
                displayString = rawText.replace(jsonRegex, '').trim();
                try {
                    const parsed = JSON.parse(match[1]);
                    if (parsed.schedule && Array.isArray(parsed.schedule)) {
                        extractedEvents = parsed.schedule;
                    }
                } catch (e) {
                    console.error("JSON Parse Error", e);
                }
            }

            if (displayString) addMessageToUI(displayString, false);
            if (extractedEvents) extractedEvents.forEach(event => renderEventCard(event));
        };

        UI.chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = UI.messageInput.value.trim();
            if (!text) return;

            UI.messageInput.value = '';
            UI.messageInput.style.height = 'auto';
            UI.sendBtn.disabled = true;

            addMessageToUI(text, true);
            addTypingIndicator();
            
            // Drop keyboard on mobile
            UI.messageInput.blur();
            
            callGeminiAPI(text);
        });

        window.addEventListener('DOMContentLoaded', () => {
            UI.sendBtn.disabled = true;
            if (!localStorage.getItem('gemini_api_key')) {
                setTimeout(() => showAlert("SYS: INSERT_API_KEY"), 500);
            }
        });
    </script>
</body>
</html>
