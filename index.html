<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Daily AI</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Daily AI">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8943/8943377.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }
        body, html {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            /* Use dvh for mobile browsers to account for address bars */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; /* Prevent full-page bounce/scroll */
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .chat-scroll-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        .message-enter {
            animation: slideIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(15px) scale(0.98);
            transform-origin: bottom;
        }
        
        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .chat-bubble {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col text-slate-800 antialiased relative">

    <header class="flex-shrink-0 bg-white/80 backdrop-blur-md border-b border-slate-200 z-10 flex items-center justify-between px-4 py-3" style="padding-top: max(0.75rem, var(--safe-area-inset-top));">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white shadow-sm">
                <i class="fa-solid fa-sparkles text-sm"></i>
            </div>
            <div class="flex flex-col">
                <h1 class="font-semibold text-[16px] leading-tight text-slate-900">Personal AI</h1>
                <p class="text-[11px] text-emerald-500 font-medium tracking-wide uppercase">Active</p>
            </div>
        </div>
        <button id="settingsBtn" class="w-9 h-9 rounded-full hover:bg-slate-100 active:bg-slate-200 flex items-center justify-center text-slate-500 transition-colors">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <main id="chatContainer" class="flex-1 chat-scroll-container p-4 flex flex-col gap-4 pb-4">
        <!-- Welcome Message -->
        <div class="flex flex-col items-center justify-center mt-8 mb-4 text-slate-400">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-calendar-check text-2xl text-slate-300"></i>
            </div>
            <p class="text-[14px] text-center px-6 max-w-xs leading-relaxed text-slate-500">
                Log your day, set reminders, or say <br><span class="font-medium text-slate-700">"Schedule a run tomorrow at 5pm"</span>
            </p>
        </div>
    </main>

    <footer class="flex-shrink-0 bg-white border-t border-slate-200 z-10" style="padding-bottom: var(--safe-area-inset-bottom);">
        <form id="chatForm" class="p-3 flex items-end gap-2">
            <div class="flex-1 bg-slate-100 rounded-2xl relative border border-slate-200 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
                <textarea id="messageInput" rows="1" class="w-full bg-transparent resize-none outline-none py-3 px-4 max-h-[120px] text-[15px] leading-tight text-slate-800" placeholder="Message..." required></textarea>
            </div>
            <button type="submit" id="sendBtn" class="w-[46px] h-[46px] bg-blue-500 rounded-full flex-shrink-0 flex items-center justify-center text-white shadow-sm hover:bg-blue-600 active:bg-blue-700 transition-colors disabled:opacity-50 disabled:bg-slate-300">
                <i class="fa-solid fa-arrow-up text-lg"></i>
            </button>
        </form>
    </footer>

    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 z-50 hidden flex-col justify-end sm:justify-center items-center backdrop-blur-sm transition-opacity opacity-0 duration-300">
        <div class="bg-white w-full sm:w-[400px] rounded-t-3xl sm:rounded-2xl p-6 pb-8 shadow-2xl transform transition-transform translate-y-full duration-300" id="settingsContent" style="padding-bottom: max(2rem, var(--safe-area-inset-bottom));">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-slate-900">Configuration</h2>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-700 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Gemini API Key</label>
                    <input type="password" id="apiKeyInput" class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-[15px]" placeholder="AIzaSy...">
                    <p class="text-[12px] text-slate-500 mt-2 leading-relaxed">Stored securely on your device. Required to process natural language.</p>
                </div>
                
                <button id="saveSettingsBtn" class="w-full bg-slate-900 text-white font-medium text-[15px] py-3.5 rounded-xl hover:bg-slate-800 active:bg-slate-950 transition-colors">
                    Save Key
                </button>
            </div>
        </div>
    </div>

    <!-- Alert Toast -->
    <div id="alertBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full shadow-lg z-[100] transition-all duration-300 opacity-0 -translate-y-[150%] pointer-events-none flex items-center gap-2 w-max max-w-[90vw]">
        <i class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="alertMessage" class="text-[14px] font-medium truncate"></span>
    </div>

    <script>
        // PWA Setup
        const setupPWA = () => {
            const manifest = {
                name: "Daily AI Log",
                short_name: "DailyAI",
                start_url: ".",
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#ffffff",
                icons: [{ src: "https://cdn-icons-png.flaticon.com/512/8943/8943377.png", sizes: "512x512", type: "image/png" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);
        };
        setupPWA();

        // UI State
        let chatHistory = [];
        const UI = {
            chatContainer: document.getElementById('chatContainer'),
            chatForm: document.getElementById('chatForm'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsModal: document.getElementById('settingsModal'),
            settingsContent: document.getElementById('settingsContent'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            alertBox: document.getElementById('alertBox'),
            alertMessage: document.getElementById('alertMessage')
        };

        const showAlert = (message, duration = 3000) => {
            UI.alertMessage.textContent = message;
            UI.alertBox.classList.remove('opacity-0', '-translate-y-[150%]');
            UI.alertBox.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                UI.alertBox.classList.remove('opacity-100', 'translate-y-0');
                UI.alertBox.classList.add('opacity-0', '-translate-y-[150%]');
            }, duration);
        };

        // Textarea Auto-resize
        UI.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            UI.sendBtn.disabled = this.value.trim() === '';
        });

        UI.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(this.value.trim() !== '') UI.chatForm.dispatchEvent(new Event('submit'));
            }
        });

        const scrollToBottom = () => {
            requestAnimationFrame(() => {
                UI.chatContainer.scrollTop = UI.chatContainer.scrollHeight;
            });
        };

        // Settings Modal
        const toggleSettings = (show) => {
            if (show) {
                UI.settingsModal.classList.remove('hidden');
                UI.settingsModal.style.display = 'flex';
                // Trigger reflow
                void UI.settingsModal.offsetWidth;
                UI.settingsModal.classList.remove('opacity-0');
                UI.settingsContent.classList.remove('translate-y-full');
            } else {
                UI.settingsModal.classList.add('opacity-0');
                UI.settingsContent.classList.add('translate-y-full');
                setTimeout(() => {
                    UI.settingsModal.classList.add('hidden');
                    UI.settingsModal.style.display = 'none';
                }, 300);
            }
        };

        UI.settingsBtn.addEventListener('click', () => {
            UI.apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            toggleSettings(true);
        });
        
        UI.closeSettingsBtn.addEventListener('click', () => toggleSettings(false));
        UI.settingsModal.addEventListener('click', (e) => {
            if (e.target === UI.settingsModal) toggleSettings(false);
        });

        UI.saveSettingsBtn.addEventListener('click', () => {
            const key = UI.apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                showAlert('API Key saved');
                toggleSettings(false);
            } else {
                showAlert('Please enter a valid key');
            }
        });

        const addMessageToUI = (text, isUser) => {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble max-w-[85%] sm:max-w-[75%] px-4 py-2.5 text-[15px] leading-[1.4] shadow-sm w-fit ${
                isUser 
                ? 'bg-blue-500 text-white rounded-2xl rounded-br-[4px]' 
                : 'bg-white text-slate-800 border border-slate-100 rounded-2xl rounded-bl-[4px]'
            }`;
            
            // Basic markdown bolding parsing
            let formattedText = text;
            if (!isUser) {
                formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900">$1</strong>');
            }
            
            bubble.innerHTML = formattedText;
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        };

        const addTypingIndicator = () => {
            const wrapper = document.createElement('div');
            wrapper.id = 'typingIndicator';
            wrapper.className = `flex w-full message-enter justify-start`;
            
            const bubble = document.createElement('div');
            bubble.className = `px-4 py-3.5 bg-white border border-slate-100 rounded-2xl rounded-bl-[4px] shadow-sm flex items-center space-x-1 w-fit`;
            
            for(let i=0; i<3; i++) {
                const dot = document.createElement('div');
                dot.className = 'w-1.5 h-1.5 bg-slate-400 rounded-full typing-dot';
                bubble.appendChild(dot);
            }
            
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
        };

        const removeTypingIndicator = () => {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        };

        const createGoogleCalendarLink = (event) => {
            const formatForUrl = (dateStr) => {
                const d = new Date(dateStr);
                // Ensure format is YYYYMMDDTHHmmssZ
                return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
            };
            try {
                const start = formatForUrl(event.StartTime);
                const end = formatForUrl(event.EndTime);
                const title = encodeURIComponent(event.EventName);
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}`;
            } catch (e) {
                return "#";
            }
        };

        const renderEventCard = (event) => {
            const card = document.createElement('div');
            card.className = 'flex w-full message-enter justify-start mt-1';
            
            const startDate = new Date(event.StartTime);
            const endDate = new Date(event.EndTime);
            
            const timeString = `${startDate.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'})} - ${endDate.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'})}`;
            const dateString = startDate.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
            const calUrl = createGoogleCalendarLink(event);

            card.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[75%] bg-white border border-slate-200 rounded-2xl p-3 shadow-sm w-full">
                    <div class="flex items-start gap-3">
                        <div class="bg-blue-50 text-blue-500 w-10 h-10 flex items-center justify-center rounded-xl flex-shrink-0">
                            <i class="fa-regular fa-calendar text-lg"></i>
                        </div>
                        <div class="flex-1 min-w-0 pt-0.5">
                            <h4 class="font-semibold text-slate-900 text-[15px] truncate">${event.EventName}</h4>
                            <p class="text-[13px] text-slate-500 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${dateString}, ${timeString}</p>
                        </div>
                    </div>
                    <a href="${calUrl}" target="_blank" class="mt-3 flex items-center justify-center gap-2 bg-slate-50 border border-slate-200 text-slate-700 text-[14px] font-medium px-4 py-2.5 rounded-xl active:bg-slate-100 transition-colors w-full text-center">
                        Add to Calendar <i class="fa-solid fa-arrow-up-right-from-square text-[12px] opacity-70"></i>
                    </a>
                </div>
            `;
            UI.chatContainer.appendChild(card);
            scrollToBottom();
        };

        const callGeminiAPI = async (userText) => {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                removeTypingIndicator();
                showAlert("Please add your API key first");
                toggleSettings(true);
                return;
            }

            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            const currentDateTime = new Date().toLocaleString();
            const systemPrompt = `You are a helpful AI personal assistant. Current Date/Time: ${currentDateTime}.
            1. Respond naturally to the user.
            2. IF the user asks to schedule something, append a JSON block at the very end of your message formatted exactly like this:
            \`\`\`json
            {
              "schedule": [
                {"EventName": "Title", "StartTime": "2026-09-19T14:00:00", "EndTime": "2026-09-19T15:00:00"}
              ]
            }
            \`\`\`
            Ensure the time strings are valid ISO 8601 format relative to the current date/time provided above.`;

            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Request Failed");
                
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiText) {
                    processAIResponse(aiText);
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                }

            } catch (error) {
                removeTypingIndicator();
                addMessageToUI("Sorry, I had trouble connecting. Check your API key.", false);
            }
        };

        const processAIResponse = (rawText) => {
            removeTypingIndicator();
            const jsonRegex = /```json\n([\s\S]*?)\n```/;
            const match = rawText.match(jsonRegex);
            
            let displayString = rawText;
            let extractedEvents = null;

            if (match && match[1]) {
                displayString = rawText.replace(jsonRegex, '').trim();
                try {
                    const parsed = JSON.parse(match[1]);
                    if (parsed.schedule && Array.isArray(parsed.schedule)) {
                        extractedEvents = parsed.schedule;
                    }
                } catch (e) {
                    console.error("JSON Parse Error", e);
                }
            }

            if (displayString) addMessageToUI(displayString, false);
            if (extractedEvents) extractedEvents.forEach(event => renderEventCard(event));
        };

        UI.chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = UI.messageInput.value.trim();
            if (!text) return;

            UI.messageInput.value = '';
            UI.messageInput.style.height = 'auto';
            UI.sendBtn.disabled = true;

            addMessageToUI(text, true);
            addTypingIndicator();
            
            // Blur input on mobile to drop the keyboard and see the message
            UI.messageInput.blur();
            
            callGeminiAPI(text);
        });

        window.addEventListener('DOMContentLoaded', () => {
            UI.sendBtn.disabled = true;
            if (!localStorage.getItem('gemini_api_key')) {
                setTimeout(() => showAlert("Tap the gear icon to set your API key"), 800);
            }
        });
    </script>
</body>
</html>
