<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S-B0T</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="S-B0T">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }
        body, html {
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            height: 100dvh; 
            width: 100vw;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            font-size: 22px; 
        }
        
        .chat-scroll-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        
        ::-webkit-scrollbar { width: 10px; border-left: 2px solid #ffffff; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background-color: #ffffff; border: 2px solid #000000; }
        
        .message-enter {
            animation: slideIn 0.2s steps(4, end) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        
        .blink-block { animation: blink 1s infinite steps(2, start); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .chat-bubble {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        
        .retro-border { border: 2px solid #ffffff; border-radius: 0px !important; }
        .retro-shadow { box-shadow: 4px 4px 0px 0px #ffffff; }
        
        .habit-box { width: 20px; height: 20px; border: 2px solid #ffffff; display: inline-block; }
        .habit-box.filled { background-color: #ffffff; }
        
        .timer-bar { height: 10px; background-color: #ffffff; width: 100%; transform-origin: left; transition: transform 1s linear; }
    </style>
</head>

<body class="flex justify-center bg-black">
    <div class="w-full max-w-md bg-black h-[100dvh] flex flex-col relative sm:border-x-2 sm:border-white">
        
        <!-- HEADER -->
        <header class="flex-shrink-0 bg-black border-b-2 border-white z-10 flex flex-col px-4 py-3 gap-2" style="padding-top: max(0.75rem, var(--safe-area-inset-top));">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 retro-border flex items-center justify-center bg-black text-white retro-shadow">
                        <i class="fa-solid fa-robot text-xl"></i>
                    </div>
                    <div class="flex flex-col leading-none pt-1">
                        <h1 class="text-3xl uppercase tracking-widest m-0 p-0 leading-none">S-B0T</h1>
                        <p id="statusIndicator" class="text-lg tracking-[0.2em] uppercase m-0 p-0 leading-none text-white blink-block">ONLINE_</p>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button id="authGoogleBtn" class="w-10 h-10 retro-border hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all flex items-center justify-center text-white retro-shadow" title="Connect Google Calendar">
                        <i class="fa-brands fa-google text-xl"></i>
                    </button>
                    <button id="settingsBtn" class="w-10 h-10 retro-border hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all flex items-center justify-center text-white retro-shadow">
                        <i class="fa-solid fa-gear text-xl"></i>
                    </button>
                </div>
            </div>
            
            <!-- Habit Tracker Grid -->
            <div class="flex items-center justify-between border-t-2 border-white pt-2 mt-1">
                <span class="text-lg uppercase tracking-widest">LOG_STREAK:</span>
                <div id="habitGrid" class="flex space-x-2">
                    <!-- JavaScript will inject 7 boxes here -->
                </div>
            </div>
        </header>

        <main id="chatContainer" class="flex-1 chat-scroll-container p-4 flex flex-col gap-6 pb-6"></main>

        <!-- IMAGE PREVIEW AREA -->
        <div id="imagePreviewContainer" class="hidden flex-shrink-0 p-2 border-t-2 border-white bg-black flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-image text-white"></i>
                <span class="text-white text-lg">IMG_ATTACHED.JPG</span>
            </div>
            <button id="removeImgBtn" class="text-white hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- FOOTER & INPUT -->
        <footer class="flex-shrink-0 bg-black border-t-2 border-white z-10" style="padding-bottom: max(0.5rem, var(--safe-area-inset-bottom));">
            <form id="chatForm" class="p-3 flex items-end gap-2">
                
                <input type="file" id="imageInput" accept="image/*" class="hidden">
                <button type="button" id="attachBtn" class="w-[50px] h-[50px] bg-black retro-border retro-shadow flex-shrink-0 flex items-center justify-center text-white hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all">
                    <i class="fa-solid fa-camera text-xl"></i>
                </button>
                
                <button type="button" id="micBtn" class="w-[50px] h-[50px] bg-black retro-border retro-shadow flex-shrink-0 flex items-center justify-center text-white hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all">
                    <i class="fa-solid fa-microphone text-xl"></i>
                </button>
                
                <div class="flex-1 bg-black retro-border flex items-center px-2 retro-shadow focus-within:bg-gray-900 transition-colors">
                    <textarea id="messageInput" rows="1" class="w-full bg-transparent resize-none outline-none py-3 max-h-[100px] text-xl text-white placeholder-gray-400" placeholder="> Input..." required></textarea>
                </div>
                
                <button type="submit" id="sendBtn" class="w-[50px] h-[50px] bg-black retro-border retro-shadow flex-shrink-0 flex items-center justify-center text-white hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none transition-all disabled:opacity-50">
                    <i class="fa-solid fa-square-caret-right text-2xl"></i>
                </button>
            </form>
        </footer>

        <div id="settingsModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col justify-center items-center p-4">
            <div class="bg-black w-full max-w-sm retro-border p-6 retro-shadow" id="settingsContent">
                <div class="flex justify-between items-center mb-4 border-b-2 border-white pb-2">
                    <h2 class="text-3xl uppercase tracking-widest">> SYS_CONFIG</h2>
                    <button id="closeSettingsBtn" class="text-white hover:bg-white hover:text-black w-8 h-8 retro-border flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-lg text-white mb-1 uppercase tracking-widest">Gemini API Key</label>
                        <input type="password" id="apiKeyInput" class="w-full bg-black retro-border px-2 py-2 outline-none text-xl focus:bg-white focus:text-black transition-colors" placeholder="AIzaSy...">
                    </div>
                    <div>
                        <label class="block text-lg text-white mb-1 uppercase tracking-widest">Google OAuth Client ID</label>
                        <input type="text" id="clientIdInput" class="w-full bg-black retro-border px-2 py-2 outline-none text-xl focus:bg-white focus:text-black transition-colors" placeholder="123456...apps.googleusercontent.com">
                        <p class="text-sm mt-1 text-gray-400">Required for direct Google Calendar Sync.</p>
                    </div>
                    <button id="saveSettingsBtn" class="w-full bg-black text-white uppercase text-2xl py-2 retro-border retro-shadow hover:bg-white hover:text-black active:translate-y-1 active:translate-x-1 active:shadow-none mt-2">
                        SAVE_CONFIG
                    </button>
                    <button id="clearHistoryBtn" class="w-full bg-black text-white uppercase text-xl py-2 retro-border border-dashed hover:bg-white hover:text-black mt-4">
                        WIPE_LOCAL_MEMORY
                    </button>
                </div>
            </div>
        </div>

        <div id="alertBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-black text-white px-4 py-2 retro-border retro-shadow z-[100] transition-all duration-200 opacity-0 -translate-y-[150%] pointer-events-none flex items-center gap-3 w-max max-w-[90vw]">
            <i class="fa-solid fa-terminal text-xl"></i>
            <span id="alertMessage" class="text-xl uppercase tracking-wide"></span>
        </div>
    </div>

    <script>
        // PWA Setup
        const setupPWA = () => {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="black"/><rect x="32" y="32" width="448" height="448" fill="none" stroke="white" stroke-width="24"/><text x="256" y="270" font-family="monospace" font-size="120" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">S-B0T</text></svg>`;
            const base64Icon = `data:image/svg+xml;base64,${btoa(svgIcon)}`;
            const manifest = {
                name: "S-B0T", short_name: "S-B0T", start_url: ".", display: "standalone",
                background_color: "#000000", theme_color: "#000000",
                icons: [{ src: base64Icon, sizes: "512x512", type: "image/svg+xml" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="icon" href="${base64Icon}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="apple-touch-icon" href="${base64Icon}">`);
        };
        setupPWA();

        // App State
        let chatHistory = JSON.parse(localStorage.getItem('sbot_history')) || [];
        let habitData = JSON.parse(localStorage.getItem('sbot_habits')) || {};
        let pendingImageData = null; 
        let pendingImageMime = null;
        let googleAccessToken = null;
        let tokenClient = null;
        
        const AudioSys = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            beep: function(freq, duration, type='square', vol=0.1) {
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                osc.stop(this.ctx.currentTime + duration);
            },
            playSend: function() {
                this.init();
                this.beep(880, 0.1);
            },
            playReceive: function() {
                this.init();
                setTimeout(() => this.beep(600, 0.1), 0);
                setTimeout(() => this.beep(800, 0.15), 100);
            },
            playTimerAlarm: function() {
                this.init();
                let count = 0;
                let int = setInterval(() => {
                    this.beep(1200, 0.1);
                    count++;
                    if(count >= 8) clearInterval(int);
                }, 200);
            }
        };

        // Initialize user interaction for Audio Context
        document.body.addEventListener('click', () => AudioSys.init(), { once: true });

        const UI = {
            chatContainer: document.getElementById('chatContainer'),
            chatForm: document.getElementById('chatForm'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            micBtn: document.getElementById('micBtn'),
            attachBtn: document.getElementById('attachBtn'),
            imageInput: document.getElementById('imageInput'),
            imagePreview: document.getElementById('imagePreviewContainer'),
            removeImgBtn: document.getElementById('removeImgBtn'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsModal: document.getElementById('settingsModal'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            clientIdInput: document.getElementById('clientIdInput'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            clearHistoryBtn: document.getElementById('clearHistoryBtn'),
            alertBox: document.getElementById('alertBox'),
            alertMessage: document.getElementById('alertMessage'),
            authGoogleBtn: document.getElementById('authGoogleBtn'),
            habitGrid: document.getElementById('habitGrid')
        };

        const showAlert = (message, duration = 3000) => {
            UI.alertMessage.textContent = message;
            UI.alertBox.classList.remove('opacity-0', '-translate-y-[150%]');
            UI.alertBox.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                UI.alertBox.classList.remove('opacity-100', 'translate-y-0');
                UI.alertBox.classList.add('opacity-0', '-translate-y-[150%]');
            }, duration);
        };

        const scrollToBottom = () => {
            requestAnimationFrame(() => {
                UI.chatContainer.scrollTop = UI.chatContainer.scrollHeight;
            });
        };

        const initGoogleOAuth = () => {
            const clientId = localStorage.getItem('google_client_id');
            if (clientId && window.google) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (tokenResponse) => {
                        googleAccessToken = tokenResponse.access_token;
                        UI.authGoogleBtn.classList.add('bg-white', 'text-black');
                        showAlert('G-CAL AUTHENTICATED');
                    }
                });
            }
        };

        window.onload = () => {
            setTimeout(initGoogleOAuth, 1000); 
            renderHabitGrid();
            renderHistory();
        };

        UI.authGoogleBtn.addEventListener('click', () => {
            if (!localStorage.getItem('google_client_id')) {
                showAlert('ERR: SET CLIENT ID IN CONFIG');
                UI.settingsBtn.click();
                return;
            }
            if (tokenClient) {
                tokenClient.requestAccessToken();
            } else {
                initGoogleOAuth();
                if(tokenClient) tokenClient.requestAccessToken();
            }
        });

        const renderHabitGrid = () => {
            UI.habitGrid.innerHTML = '';
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const dateKey = d.toISOString().split('T')[0];
                
                const box = document.createElement('div');
                box.className = `habit-box ${habitData[dateKey] ? 'filled' : ''} transition-colors duration-300`;
                box.title = dateKey;
                
                box.addEventListener('click', () => {
                    habitData[dateKey] = !habitData[dateKey];
                    localStorage.setItem('sbot_habits', JSON.stringify(habitData));
                    renderHabitGrid();
                    AudioSys.beep(440, 0.05);
                });
                
                UI.habitGrid.appendChild(box);
            }
        };

        const markHabitToday = () => {
            const dateKey = new Date().toISOString().split('T')[0];
            habitData[dateKey] = true;
            localStorage.setItem('sbot_habits', JSON.stringify(habitData));
            renderHabitGrid();
        };

        UI.attachBtn.addEventListener('click', () => UI.imageInput.click());
        
        UI.imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const fullBase64 = event.target.result;
                pendingImageData = fullBase64.split(',')[1];
                pendingImageMime = file.type;
                
                UI.imagePreview.classList.remove('hidden');
                showAlert('IMG_LOADED_TO_MEMORY');
            };
            reader.readAsDataURL(file);
        });

        UI.removeImgBtn.addEventListener('click', () => {
            pendingImageData = null;
            pendingImageMime = null;
            UI.imageInput.value = '';
            UI.imagePreview.classList.add('hidden');
        });

        UI.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            UI.sendBtn.disabled = this.value.trim() === '' && !pendingImageData;
        });

        UI.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(this.value.trim() !== '' || pendingImageData) UI.chatForm.dispatchEvent(new Event('submit'));
            }
        });

        UI.settingsBtn.addEventListener('click', () => {
            UI.apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            UI.clientIdInput.value = localStorage.getItem('google_client_id') || '';
            UI.settingsModal.classList.remove('hidden');
            UI.settingsModal.style.display = 'flex';
        });

        UI.closeSettingsBtn.addEventListener('click', () => {
            UI.settingsModal.classList.add('hidden');
            UI.settingsModal.style.display = 'none';
        });

        UI.saveSettingsBtn.addEventListener('click', () => {
            localStorage.setItem('gemini_api_key', UI.apiKeyInput.value.trim());
            localStorage.setItem('google_client_id', UI.clientIdInput.value.trim());
            initGoogleOAuth();
            showAlert('CONFIG_SAVED');
            UI.closeSettingsBtn.click();
        });

        UI.clearHistoryBtn.addEventListener('click', () => {
            chatHistory = [];
            localStorage.removeItem('sbot_history');
            UI.chatContainer.innerHTML = '';
            showAlert('MEMORY_WIPED');
            UI.closeSettingsBtn.click();
        });

        const addMessageToUI = (text, isUser, attachedImgData = null) => {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            
            let classes = `chat-bubble max-w-[85%] sm:max-w-[75%] px-4 py-2 text-xl leading-[1.2] w-fit bg-black text-white retro-border`;
            if (isUser) {
                bubble.className = classes + ` retro-shadow`;
            } else {
                bubble.className = classes + ` border-dashed`; 
            }
            
            let htmlContent = text.replace(/\*\*(.*?)\*\*/g, '<span class="underline uppercase">$1</span>');
            
            if (attachedImgData) {
                htmlContent = `<div class="mb-2 border-2 border-white p-1 bg-white text-black text-sm uppercase"><i class="fa-solid fa-image"></i> DATA_ATTACHED</div>` + htmlContent;
            }
            
            bubble.innerHTML = htmlContent;
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        };

        const renderTypingIndicator = () => {
            const wrapper = document.createElement('div');
            wrapper.id = 'typingIndicator';
            wrapper.className = `flex w-full message-enter justify-start`;
            wrapper.innerHTML = `<div class="px-4 py-2 bg-black retro-border border-dashed flex items-center space-x-2 w-fit"><div class="w-3 h-5 bg-white blink-block"></div></div>`;
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
        };

        const removeTypingIndicator = () => {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        };

        const createTimerElement = (seconds, label) => {
            const timerId = 'timer_' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.className = 'flex w-full message-enter justify-start mt-2 mb-2';
            
            wrapper.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[75%] bg-black retro-border p-4 retro-shadow w-full" id="${timerId}">
                    <div class="flex items-center justify-between mb-2 border-b-2 border-white pb-2">
                        <span class="text-xl uppercase"><i class="fa-solid fa-stopwatch"></i> ${label}</span>
                        <span class="text-2xl" id="${timerId}_display">00:00</span>
                    </div>
                    <div class="w-full h-[14px] border-2 border-white p-[2px]">
                        <div class="timer-bar" id="${timerId}_bar" style="transform: scaleX(1)"></div>
                    </div>
                    <button class="mt-3 w-full border-2 border-white py-1 hover:bg-white hover:text-black uppercase text-lg" id="${timerId}_cancel">ABORT</button>
                </div>
            `;
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();

            let remaining = seconds;
            let total = seconds;
            
            const updateDisplay = () => {
                const mins = Math.floor(remaining / 60).toString().padStart(2, '0');
                const secs = (remaining % 60).toString().padStart(2, '0');
                document.getElementById(`${timerId}_display`).innerText = `${mins}:${secs}`;
                
                const percentage = remaining / total;
                document.getElementById(`${timerId}_bar`).style.transform = `scaleX(${percentage})`;
            };
            
            updateDisplay();
            
            const interval = setInterval(() => {
                remaining--;
                if (remaining < 0) {
                    clearInterval(interval);
                    document.getElementById(timerId).classList.add('blink-block');
                    document.getElementById(`${timerId}_display`).innerText = `00:00`;
                    document.getElementById(`${timerId}_bar`).style.transform = `scaleX(0)`;
                    AudioSys.playTimerAlarm();
                    document.getElementById(`${timerId}_cancel`).innerText = "DISMISS";
                    document.getElementById(`${timerId}_cancel`).onclick = () => document.getElementById(timerId).remove();
                } else {
                    updateDisplay();
                }
            }, 1000);

            document.getElementById(`${timerId}_cancel`).onclick = () => {
                clearInterval(interval);
                document.getElementById(timerId).remove();
            };
        };

        const checkConflicts = async (start, end) => {
            const startIso = new Date(start).toISOString();
            const endIso = new Date(end).toISOString();
            const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${startIso}&timeMax=${endIso}&singleEvents=true`, {
                headers: { 'Authorization': `Bearer ${googleAccessToken}` }
            });
            const data = await res.json();
            return data.items && data.items.length > 0;
        };

        const renderScheduleConfirmation = async (eventData) => {
            if (!googleAccessToken) {
                addMessageToUI("> WARN: GOOGLE OAUTH MISSING. CANNOT ACCESS CALENDAR.", false);
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'flex w-full message-enter justify-start mt-2 mb-2';
            const cardId = 'sched_' + Date.now();
            
            wrapper.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[75%] bg-black retro-border p-4 retro-shadow w-full" id="${cardId}">
                    <div class="mb-2 border-b-2 border-white pb-2">
                        <span class="text-xl uppercase"><i class="fa-solid fa-calendar-plus"></i> PREPARE_SCHEDULE</span>
                    </div>
                    <div class="text-lg mb-4">
                        <div>EVENT: ${eventData.title.toUpperCase()}</div>
                        <div>START: ${eventData.start.replace('T', ' ')}</div>
                        <div>END: ${eventData.end.replace('T', ' ')}</div>
                        <div id="${cardId}_status" class="mt-2 text-white blink-block">> CHECKING CONFLICTS...</div>
                    </div>
                    <div class="flex gap-2 hidden" id="${cardId}_actions">
                        <button class="w-full border-2 border-white py-1 hover:bg-white hover:text-black uppercase text-lg" id="${cardId}_confirm">CONFIRM</button>
                        <button class="w-full border-2 border-white py-1 hover:bg-white hover:text-black uppercase text-lg" id="${cardId}_abort">ABORT</button>
                    </div>
                </div>
            `;
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();

            try {
                const hasConflict = await checkConflicts(eventData.start, eventData.end);
                const statusEl = document.getElementById(`${cardId}_status`);
                const actionsEl = document.getElementById(`${cardId}_actions`);
                
                statusEl.classList.remove('blink-block');
                if (hasConflict) {
                    statusEl.innerHTML = `> CONFLICT DETECTED. TIME SLOT OVERLAPS EXISTING RECORD.`;
                } else {
                    statusEl.innerHTML = `> TIME SLOT CLEAR. AWAITING CONFIRMATION.`;
                }
                actionsEl.classList.remove('hidden');

                document.getElementById(`${cardId}_confirm`).onclick = async () => {
                    document.getElementById(`${cardId}_actions`).classList.add('hidden');
                    statusEl.innerHTML = `> WRITING TO CALENDAR...`;
                    statusEl.classList.add('blink-block');
                    const success = await pushToGoogleCalendar(eventData);
                    statusEl.classList.remove('blink-block');
                    if(success) {
                        statusEl.innerHTML = `> SUCCESS. SAVED TO CALENDAR.`;
                    } else {
                        statusEl.innerHTML = `> ERROR: WRITE FAILED.`;
                    }
                };
                
                document.getElementById(`${cardId}_abort`).onclick = () => {
                    document.getElementById(cardId).remove();
                    addMessageToUI("> SCHEDULE ABORTED BY USER.", true);
                };

            } catch(e) {
                document.getElementById(`${cardId}_status`).innerHTML = `> ERR: CONFLICT CHECK FAILED`;
                document.getElementById(`${cardId}_actions`).classList.remove('hidden');
            }
        };

        const pushToGoogleCalendar = async (eventData) => {
            const event = {
                summary: eventData.title,
                start: { dateTime: eventData.start, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
                end: { dateTime: eventData.end, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }
            };

            try {
                const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${googleAccessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(event)
                });
                return res.ok;
            } catch (e) {
                return false;
            }
        };

        const deleteEventFromCalendar = async (title) => {
            if (!googleAccessToken) {
                addMessageToUI("> WARN: GOOGLE OAUTH MISSING. CANNOT ACCESS CALENDAR.", false);
                return;
            }
            
            try {
                const searchResponse = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?q=${encodeURIComponent(title)}`, {
                    headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                });
                const searchData = await searchResponse.json();
                
                if (searchData.items && searchData.items.length > 0) {
                    const eventId = searchData.items[0].id;
                    const delRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${googleAccessToken}` }
                    });
                    
                    if (delRes.ok) {
                        addMessageToUI(`> SUCCESS. EVENT "${title.toUpperCase()}" PURGED FROM CALENDAR.`, false);
                    } else {
                        addMessageToUI(`> ERR: FAILED TO DELETE EVENT.`, false);
                    }
                } else {
                    addMessageToUI(`> ERR: EVENT "${title.toUpperCase()}" NOT FOUND IN CALENDAR.`, false);
                }
            } catch (e) {
                addMessageToUI("> ERR: NETWORK OR API FAILURE DURING DELETION.", false);
            }
        };

        const callGemini = async (userText, imgData, imgMime) => {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                removeTypingIndicator();
                showAlert("ERR: MISSING_API_KEY");
                UI.settingsBtn.click();
                return;
            }

            const parts = [{ text: userText || "Process attached data." }];
            if (imgData) {
                parts.push({
                    inlineData: { mimeType: imgMime, data: imgData }
                });
            }

            const historyEntry = { role: "user", parts: [...parts] };
            chatHistory.push(historyEntry);
            localStorage.setItem('sbot_history', JSON.stringify(chatHistory));

            const dt = new Date();
            const sysPrompt = `You are S-B0T, a retro terminal AI. Current Date/Time: ${dt.toISOString()}. Local Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}.
            Rules:
            1. Respond concisely. Be robotic but helpful.
            2. If the user wants to start a timer or countdown, include this exact JSON block at the end:
               \`\`\`json\n{"action": "timer", "seconds": [INT], "label": "[STRING]"}\n\`\`\`
            3. If the user wants to schedule an event AND Google Auth is active, do NOT create it directly. Request a schedule check using format YYYY-MM-DDTHH:MM:SS (WITHOUT a trailing 'Z'):
               \`\`\`json\n{"action": "schedule_request", "title": "[STRING]", "start": "YYYY-MM-DDTHH:MM:SS", "end": "YYYY-MM-DDTHH:MM:SS"}\n\`\`\`
            4. If the user wants to delete or cancel an event, output:
               \`\`\`json\n{"action": "delete", "title": "[STRING]"}\n\`\`\`
            5. If the user logs a daily habit/goal completed today, output:
               \`\`\`json\n{"action": "habit"}\n\`\`\``;

            const sanitizedContents = chatHistory.map(entry => ({
                role: entry.role,
                parts: entry.parts.map(p => {
                    if (p.inlineData) return { inlineData: { mimeType: p.inlineData.mimeType, data: p.inlineData.data } };
                    return { text: p.text };
                })
            }));

            const payload = {
                contents: sanitizedContents,
                system_instruction: { parts: [{ text: sysPrompt }] }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP ${response.status}`);
                }
                
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiText) {
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                    localStorage.setItem('sbot_history', JSON.stringify(chatHistory));
                    removeTypingIndicator();
                    processAIResponse(aiText);
                    AudioSys.playReceive();
                }
            } catch (error) {
                chatHistory.pop();
                localStorage.setItem('sbot_history', JSON.stringify(chatHistory));
                removeTypingIndicator();
                addMessageToUI(`> SYS_ERR: ${error.message.toUpperCase()}`, false);
            }
        };

        const processAIResponse = (rawText) => {
            const jsonRegex = /```json\n([\s\S]*?)\n```/;
            const match = rawText.match(jsonRegex);
            let displayString = rawText;
            let actionData = null;

            if (match && match[1]) {
                displayString = rawText.replace(jsonRegex, '').trim();
                try {
                    actionData = JSON.parse(match[1]);
                } catch (e) { console.error("JSON Error", e); }
            }

            if (displayString) addMessageToUI(displayString, false);

            if (actionData) {
                if (actionData.action === 'timer') {
                    createTimerElement(actionData.seconds, actionData.label);
                } else if (actionData.action === 'habit') {
                    markHabitToday();
                    showAlert("STREAK_UPDATED");
                } else if (actionData.action === 'schedule_request') {
                    renderScheduleConfirmation(actionData);
                } else if (actionData.action === 'delete') {
                    deleteEventFromCalendar(actionData.title);
                }
            }
        };

        UI.chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = UI.messageInput.value.trim();
            const imgToPass = pendingImageData;
            const mimeToPass = pendingImageMime;
            
            if (!text && !imgToPass) return;

            UI.messageInput.value = '';
            UI.messageInput.style.height = 'auto';
            UI.sendBtn.disabled = true;
            UI.removeImgBtn.click(); 
            UI.messageInput.blur(); 
            
            AudioSys.playSend();
            addMessageToUI(text || "[IMAGE_UPLOADED]", true, imgToPass);
            renderTypingIndicator();
            
            callGemini(text, imgToPass, mimeToPass);
        });

        const renderHistory = () => {
            UI.chatContainer.innerHTML = '';
            chatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    const hasImg = msg.parts.some(p => p.inlineData);
                    const textPart = msg.parts.find(p => p.text)?.text || "[IMG_DATA]";
                    addMessageToUI(textPart, true, hasImg ? "true" : null);
                } else {
                    const cleanText = msg.parts[0].text.replace(/```json\n([\s\S]*?)\n```/, '').trim();
                    if(cleanText) addMessageToUI(cleanText, false);
                }
            });
            scrollToBottom();
        };
    </script>
</body>
</html>
