<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S-B0T</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="S-B0T">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }
        body, html {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100dvh; 
            width: 100vw;
            background-color: #ffffff; /* Strict B&W */
            color: #000000;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .chat-scroll-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        
        /* Custom Scrollbar for Chat */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #000000; border-radius: 10px; }
        
        /* Message Entrance Animation */
        .message-enter {
            animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }
        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Typing Indicator Animation */
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .chat-bubble {
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>

<body class="flex justify-center bg-white sm:bg-neutral-100">

    <!-- Mobile container framing -->
    <div class="w-full max-w-md bg-white h-[100dvh] flex flex-col relative sm:border-x-2 sm:border-black shadow-2xl">
        
        <!-- Header -->
        <header class="flex-shrink-0 bg-white border-b-2 border-black z-10 flex items-center justify-between px-5 py-4" style="padding-top: max(1rem, var(--safe-area-inset-top));">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center text-white">
                    <i class="fa-solid fa-robot text-lg"></i>
                </div>
                <div class="flex flex-col">
                    <h1 class="font-extrabold text-[18px] leading-tight tracking-tight text-black">S-B0T</h1>
                    <p class="text-[11px] text-black font-bold tracking-widest uppercase">Online</p>
                </div>
            </div>
            <button id="settingsBtn" class="w-10 h-10 rounded-full border-2 border-transparent hover:border-black active:bg-black active:text-white flex items-center justify-center text-black transition-all">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </header>

        <!-- Chat Container -->
        <main id="chatContainer" class="flex-1 chat-scroll-container p-4 flex flex-col gap-5 pb-6">
            <!-- Initial Greeting -->
            <div class="flex flex-col items-center justify-center mt-10 mb-6 text-black">
                <div class="w-20 h-20 border-4 border-black rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-bolt text-3xl"></i>
                </div>
                <h2 class="font-extrabold text-2xl mb-2">SYSTEM READY</h2>
                <p class="text-[14px] text-center px-4 max-w-xs font-semibold">
                    Log your day, or ask me to schedule an event.
                </p>
            </div>
        </main>

        <!-- Input Footer -->
        <footer class="flex-shrink-0 bg-white border-t-2 border-black z-10" style="padding-bottom: max(0.5rem, var(--safe-area-inset-bottom));">
            <form id="chatForm" class="p-3 flex items-end gap-3">
                <div class="flex-1 bg-white rounded-full border-2 border-black focus-within:ring-2 focus-within:ring-black focus-within:ring-offset-1 transition-all flex items-center px-4">
                    <textarea id="messageInput" rows="1" class="w-full bg-transparent resize-none outline-none py-3 max-h-[120px] text-[15px] font-medium text-black placeholder-black placeholder-opacity-50" placeholder="Message S-B0T..." required></textarea>
                </div>
                <button type="submit" id="sendBtn" class="w-[50px] h-[50px] bg-black rounded-full flex-shrink-0 flex items-center justify-center text-white hover:opacity-80 active:scale-95 transition-all disabled:opacity-30 disabled:active:scale-100">
                    <i class="fa-solid fa-paper-plane text-lg"></i>
                </button>
            </form>
        </footer>

        <!-- Settings Modal (Strict B&W) -->
        <div id="settingsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-end items-center backdrop-blur-sm transition-opacity opacity-0 duration-300">
            <div class="bg-white w-full max-w-md border-t-2 border-black sm:border-2 sm:rounded-2xl sm:mb-10 rounded-t-3xl p-6 pb-8 transform transition-transform translate-y-full duration-300" id="settingsContent" style="padding-bottom: max(2rem, var(--safe-area-inset-bottom));">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold text-black uppercase tracking-tight">Configuration</h2>
                    <button id="closeSettingsBtn" class="text-black hover:bg-black hover:text-white w-10 h-10 border-2 border-black flex items-center justify-center rounded-full transition-colors">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-black mb-2 uppercase tracking-wide">Gemini API Key</label>
                        <input type="password" id="apiKeyInput" class="w-full border-2 border-black rounded-xl px-4 py-4 outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 text-[15px] font-medium" placeholder="AIzaSy...">
                        <p class="text-[13px] text-black font-semibold mt-3">Stored securely on your device. Required to power the AI.</p>
                    </div>
                    
                    <button id="saveSettingsBtn" class="w-full bg-black text-white font-bold uppercase text-[15px] py-4 rounded-xl border-2 border-black hover:bg-white hover:text-black active:scale-[0.98] transition-all tracking-wider">
                        Save System Key
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Toast Alert (Black & White) -->
        <div id="alertBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-black text-white px-6 py-4 rounded-2xl shadow-xl z-[100] transition-all duration-300 opacity-0 -translate-y-[150%] pointer-events-none flex items-center gap-3 border-2 border-white w-max max-w-[90vw]">
            <i class="fa-solid fa-circle-exclamation text-lg"></i>
            <span id="alertMessage" class="text-[15px] font-bold"></span>
        </div>
    </div>

    <script>
        // PWA Setup with Base64 SVG Icon (Black background, white text)
        const setupPWA = () => {
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="black"/><text x="256" y="270" font-family="sans-serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">S-B0T</text></svg>`;
            const base64Icon = `data:image/svg+xml;base64,${btoa(svgIcon)}`;
            
            const manifest = {
                name: "S-B0T",
                short_name: "S-B0T",
                start_url: ".",
                display: "standalone",
                background_color: "#ffffff",
                theme_color: "#ffffff",
                icons: [{ src: base64Icon, sizes: "512x512", type: "image/svg+xml" }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="icon" href="${base64Icon}">`);
            document.head.insertAdjacentHTML('beforeend', `<link rel="apple-touch-icon" href="${base64Icon}">`);
        };
        setupPWA();

        // UI State & Elements
        let chatHistory = [];
        const UI = {
            chatContainer: document.getElementById('chatContainer'),
            chatForm: document.getElementById('chatForm'),
            messageInput: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsModal: document.getElementById('settingsModal'),
            settingsContent: document.getElementById('settingsContent'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            alertBox: document.getElementById('alertBox'),
            alertMessage: document.getElementById('alertMessage')
        };

        const showAlert = (message, duration = 3000) => {
            UI.alertMessage.textContent = message;
            UI.alertBox.classList.remove('opacity-0', '-translate-y-[150%]');
            UI.alertBox.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                UI.alertBox.classList.remove('opacity-100', 'translate-y-0');
                UI.alertBox.classList.add('opacity-0', '-translate-y-[150%]');
            }, duration);
        };

        // Textarea Auto-resize
        UI.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            UI.sendBtn.disabled = this.value.trim() === '';
        });

        UI.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if(this.value.trim() !== '') UI.chatForm.dispatchEvent(new Event('submit'));
            }
        });

        const scrollToBottom = () => {
            requestAnimationFrame(() => {
                UI.chatContainer.scrollTop = UI.chatContainer.scrollHeight;
            });
        };

        // Settings Modal Handling
        const toggleSettings = (show) => {
            if (show) {
                UI.settingsModal.classList.remove('hidden');
                UI.settingsModal.style.display = 'flex';
                void UI.settingsModal.offsetWidth; // Trigger reflow
                UI.settingsModal.classList.remove('opacity-0');
                UI.settingsContent.classList.remove('translate-y-full');
            } else {
                UI.settingsModal.classList.add('opacity-0');
                UI.settingsContent.classList.add('translate-y-full');
                setTimeout(() => {
                    UI.settingsModal.classList.add('hidden');
                    UI.settingsModal.style.display = 'none';
                }, 300);
            }
        };

        UI.settingsBtn.addEventListener('click', () => {
            UI.apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            toggleSettings(true);
        });
        
        UI.closeSettingsBtn.addEventListener('click', () => toggleSettings(false));
        UI.settingsModal.addEventListener('click', (e) => {
            if (e.target === UI.settingsModal) toggleSettings(false);
        });

        UI.saveSettingsBtn.addEventListener('click', () => {
            const key = UI.apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                showAlert('API Key saved successfully.');
                toggleSettings(false);
            } else {
                showAlert('Please enter a valid key.');
            }
        });

        const addMessageToUI = (text, isUser) => {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            
            // Applying strict B&W theme and specific border radii based on sender
            if (isUser) {
                // User: Black background, white text, sharp bottom right
                bubble.className = `chat-bubble max-w-[85%] sm:max-w-[75%] px-5 py-3 text-[15px] font-medium leading-[1.5] w-fit bg-black text-white rounded-[24px] rounded-br-[4px] shadow-md`;
            } else {
                // Bot: White background, black text, black border, sharp bottom left
                bubble.className = `chat-bubble max-w-[85%] sm:max-w-[75%] px-5 py-3 text-[15px] font-medium leading-[1.5] w-fit bg-white text-black border-2 border-black rounded-[24px] rounded-bl-[4px] shadow-[4px_4px_0px_rgba(0,0,0,1)]`;
            }
            
            let formattedText = text;
            if (!isUser) {
                // Simple bold markdown parsing
                formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-extrabold">$1</strong>');
            }
            
            bubble.innerHTML = formattedText;
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        };

        const addTypingIndicator = () => {
            const wrapper = document.createElement('div');
            wrapper.id = 'typingIndicator';
            wrapper.className = `flex w-full message-enter justify-start`;
            
            // Bot styling for indicator
            const bubble = document.createElement('div');
            bubble.className = `px-5 py-4 bg-white border-2 border-black rounded-[24px] rounded-bl-[4px] shadow-[4px_4px_0px_rgba(0,0,0,1)] flex items-center space-x-2 w-fit`;
            
            for(let i=0; i<3; i++) {
                const dot = document.createElement('div');
                dot.className = 'w-2 h-2 bg-black rounded-full typing-dot';
                bubble.appendChild(dot);
            }
            
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
        };

        const removeTypingIndicator = () => {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        };

        const createGoogleCalendarLink = (event) => {
            const formatForUrl = (dateStr) => {
                const d = new Date(dateStr);
                return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
            };
            try {
                const start = formatForUrl(event.StartTime);
                const end = formatForUrl(event.EndTime);
                const title = encodeURIComponent(event.EventName);
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}`;
            } catch (e) {
                return "#";
            }
        };

        const renderEventCard = (event) => {
            const card = document.createElement('div');
            card.className = 'flex w-full message-enter justify-start mt-2';
            
            const startDate = new Date(event.StartTime);
            const endDate = new Date(event.EndTime);
            
            const timeString = `${startDate.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'})} - ${endDate.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'})}`;
            const dateString = startDate.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
            const calUrl = createGoogleCalendarLink(event);

            // Strict B&W Calendar Card
            card.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[75%] bg-white border-2 border-black rounded-2xl p-4 shadow-[4px_4px_0px_rgba(0,0,0,1)] w-full relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-2 h-full bg-black"></div>
                    <div class="flex items-start gap-4 pl-2">
                        <div class="w-12 h-12 border-2 border-black rounded-xl flex items-center justify-center flex-shrink-0 bg-white">
                            <i class="fa-solid fa-calendar-plus text-xl text-black"></i>
                        </div>
                        <div class="flex-1 min-w-0 pt-0.5">
                            <h4 class="font-extrabold text-black text-[16px] truncate leading-tight">${event.EventName}</h4>
                            <p class="text-[13px] font-bold text-black mt-1"><i class="fa-regular fa-clock mr-1.5"></i>${dateString}</p>
                            <p class="text-[12px] font-semibold text-black mt-0.5 ml-4">${timeString}</p>
                        </div>
                    </div>
                    <a href="${calUrl}" target="_blank" class="mt-4 flex items-center justify-center gap-2 bg-black text-white border-2 border-black text-[14px] font-bold uppercase tracking-wider px-4 py-3 rounded-xl active:bg-white active:text-black transition-all w-full text-center">
                        Add to Calendar <i class="fa-solid fa-arrow-up-right-from-square text-[13px]"></i>
                    </a>
                </div>
            `;
            UI.chatContainer.appendChild(card);
            scrollToBottom();
        };

        const callGeminiAPI = async (userText) => {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                removeTypingIndicator();
                showAlert("SYSTEM ERROR: API Key Missing.");
                toggleSettings(true);
                return;
            }

            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            const currentDateTime = new Date().toLocaleString();
            const systemPrompt = `You are S-B0T, a concise, highly efficient AI personal assistant. Current Date/Time context: ${currentDateTime}.
            1. Respond clearly and concisely to the user.
            2. IF the user asks to schedule something, add an event to their calendar, or set a time block, you MUST append a JSON block at the very end of your message formatted EXACTLY like this:
            \`\`\`json
            {
              "schedule": [
                {"EventName": "Task Title", "StartTime": "YYYY-MM-DDTHH:MM:SS", "EndTime": "YYYY-MM-DDTHH:MM:SS"}
              ]
            }
            \`\`\`
            Ensure the time strings are valid ISO 8601 format relative to the current date/time provided above. Do not hallucinate dates; use the context provided.`;

            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API Request Failed");
                
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiText) {
                    processAIResponse(aiText);
                    chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                }

            } catch (error) {
                removeTypingIndicator();
                addMessageToUI("SYSTEM ERROR: Connection failed. Verify your API key.", false);
            }
        };

        const processAIResponse = (rawText) => {
            removeTypingIndicator();
            // Regex to find the JSON block inside markdown formatting
            const jsonRegex = /```json\n([\s\S]*?)\n```/;
            const match = rawText.match(jsonRegex);
            
            let displayString = rawText;
            let extractedEvents = null;

            if (match && match[1]) {
                // Remove the JSON block from the text shown to the user
                displayString = rawText.replace(jsonRegex, '').trim();
                try {
                    const parsed = JSON.parse(match[1]);
                    if (parsed.schedule && Array.isArray(parsed.schedule)) {
                        extractedEvents = parsed.schedule;
                    }
                } catch (e) {
                    console.error("JSON Parse Error", e);
                }
            }

            if (displayString) addMessageToUI(displayString, false);
            if (extractedEvents) extractedEvents.forEach(event => renderEventCard(event));
        };

        UI.chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = UI.messageInput.value.trim();
            if (!text) return;

            UI.messageInput.value = '';
            UI.messageInput.style.height = 'auto';
            UI.sendBtn.disabled = true;

            addMessageToUI(text, true);
            addTypingIndicator();
            
            // Drop keyboard on mobile
            UI.messageInput.blur();
            
            callGeminiAPI(text);
        });

        window.addEventListener('DOMContentLoaded', () => {
            UI.sendBtn.disabled = true;
            if (!localStorage.getItem('gemini_api_key')) {
                setTimeout(() => showAlert("System initialized. Please insert API Key."), 800);
            }
        });
    </script>
</body>
</html>
