<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Daily AI</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Daily AI">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8943/8943377.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for chat area */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .message-enter {
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-gray-50 text-gray-800">

    <header class="h-16 flex-shrink-0 bg-white shadow-sm flex items-center justify-between px-4 z-10 safe-top">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold shadow-md">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div>
                <h1 class="font-semibold text-lg leading-tight">Assistant</h1>
                <p class="text-xs text-green-500 font-medium">Online</p>
            </div>
        </div>
        <button id="settingsBtn" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 transition-colors">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 pb-6 flex flex-col">
        <!-- Welcome Message -->
        <div class="flex flex-col items-center justify-center mt-10 mb-6 text-gray-400">
            <i class="fa-solid fa-shield-halved text-4xl mb-3 opacity-50"></i>
            <p class="text-sm text-center px-6">Your personal AI. Tell me about your day, log your thoughts, or ask me to schedule events.</p>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 p-3 safe-bottom flex-shrink-0">
        <form id="chatForm" class="flex items-end space-x-2">
            <div class="flex-1 bg-gray-100 rounded-2xl relative">
                <textarea id="messageInput" rows="1" class="w-full bg-transparent resize-none outline-none py-3 px-4 max-h-32 text-base" placeholder="Type a message..." required></textarea>
            </div>
            <button type="submit" class="w-12 h-12 bg-blue-500 rounded-full flex-shrink-0 flex items-center justify-center text-white shadow-md hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex flex-col justify-end sm:justify-center items-center backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full sm:w-[400px] rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl transform transition-transform translate-y-full sm:translate-y-0" id="settingsContent">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold">Settings</h2>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gemini API Key</label>
                    <input type="password" id="apiKeyInput" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="AIzaSy...">
                    <p class="text-xs text-gray-500 mt-2">Your key is stored locally on your device and never sent to any server other than Google's official API.</p>
                </div>
                
                <button id="saveSettingsBtn" class="w-full bg-black text-white font-medium py-3 rounded-xl hover:bg-gray-800 transition-colors">
                    Save Configuration
                </button>
            </div>
        </div>
    </div>

    <div id="alertBox" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg z-[100] transition-all duration-300 opacity-0 -translate-y-full pointer-events-none flex items-center space-x-2">
        <i class="fa-solid fa-circle-info"></i>
        <span id="alertMessage" class="text-sm font-medium"></span>
    </div>

    <script>
        // PWA Setup: Dynamically inject manifest and register dummy service worker for installability
        const setupPWA = () => {
            const manifest = {
                name: "Daily AI Log",
                short_name: "DailyAI",
                start_url: ".",
                display: "standalone",
                background_color: "#f9fafb",
                theme_color: "#3b82f6",
                icons: [
                    {
                        src: "https://cdn-icons-png.flaticon.com/512/8943/8943377.png",
                        sizes: "512x512",
                        type: "image/png"
                    }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestUrl = URL.createObjectURL(manifestBlob);
            document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestUrl}">`);

            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {});
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(swUrl).catch(err => console.log("SW Register failed", err));
            }
        };
        setupPWA();

        // App State
        let chatHistory = [];
        const UI = {
            chatContainer: document.getElementById('chatContainer'),
            chatForm: document.getElementById('chatForm'),
            messageInput: document.getElementById('messageInput'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsModal: document.getElementById('settingsModal'),
            settingsContent: document.getElementById('settingsContent'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            saveSettingsBtn: document.getElementById('saveSettingsBtn'),
            alertBox: document.getElementById('alertBox'),
            alertMessage: document.getElementById('alertMessage')
        };

        const showAlert = (message, duration = 3000) => {
            UI.alertMessage.textContent = message;
            UI.alertBox.classList.remove('opacity-0', '-translate-y-full');
            UI.alertBox.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                UI.alertBox.classList.remove('opacity-100', 'translate-y-0');
                UI.alertBox.classList.add('opacity-0', '-translate-y-full');
            }, duration);
        };

        // Auto-resize textarea
        UI.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value === '') {
                this.style.height = 'auto';
            }
        });

        // Handle Enter key (Shift+Enter for new line)
        UI.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                UI.chatForm.dispatchEvent(new Event('submit'));
            }
        });

        const scrollToBottom = () => {
            setTimeout(() => {
                UI.chatContainer.scrollTop = UI.chatContainer.scrollHeight;
            }, 50);
        };

        // Settings Modal Logic
        const toggleSettings = (show) => {
            if (show) {
                UI.settingsModal.classList.remove('hidden');
                // Small delay to allow display:block to apply before animating transform
                setTimeout(() => {
                    UI.settingsContent.classList.remove('translate-y-full');
                }, 10);
            } else {
                UI.settingsContent.classList.add('translate-y-full');
                setTimeout(() => {
                    UI.settingsModal.classList.add('hidden');
                }, 300);
            }
        };

        UI.settingsBtn.addEventListener('click', () => {
            UI.apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
            toggleSettings(true);
        });
        
        UI.closeSettingsBtn.addEventListener('click', () => toggleSettings(false));
        UI.settingsModal.addEventListener('click', (e) => {
            if (e.target === UI.settingsModal) toggleSettings(false);
        });

        UI.saveSettingsBtn.addEventListener('click', () => {
            const key = UI.apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                showAlert('Settings saved successfully');
                toggleSettings(false);
            } else {
                showAlert('Please enter a valid API key');
            }
        });

        const addMessageToUI = (text, isUser, containsEvent = false) => {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] sm:max-w-[75%] px-4 py-3 rounded-2xl text-[15px] leading-relaxed shadow-sm ${
                isUser 
                ? 'bg-blue-500 text-white rounded-br-sm' 
                : 'bg-white text-gray-800 border border-gray-100 rounded-bl-sm'
            }`;
            
            // Basic markdown formatting for AI responses (bolding)
            let formattedText = text;
            if (!isUser) {
                formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>');
            }
            
            bubble.innerHTML = formattedText;
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        };

        const addTypingIndicator = () => {
            const wrapper = document.createElement('div');
            wrapper.id = 'typingIndicator';
            wrapper.className = `flex w-full message-enter justify-start`;
            
            const bubble = document.createElement('div');
            bubble.className = `px-5 py-4 bg-white border border-gray-100 rounded-2xl rounded-bl-sm shadow-sm flex space-x-1`;
            
            for(let i=0; i<3; i++) {
                const dot = document.createElement('div');
                dot.className = 'w-2 h-2 bg-gray-400 rounded-full typing-dot';
                bubble.appendChild(dot);
            }
            
            wrapper.appendChild(bubble);
            UI.chatContainer.appendChild(wrapper);
            scrollToBottom();
        };

        const removeTypingIndicator = () => {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        };

        const createGoogleCalendarLink = (event) => {
            // Convert standard ISO to Google Calendar format (YYYYMMDDTHHmmss)
            const formatForUrl = (dateStr) => {
                const d = new Date(dateStr);
                return d.toISOString().replace(/-|:|\.\d\d\d/g, "");
            };
            
            try {
                const start = formatForUrl(event.StartTime);
                const end = formatForUrl(event.EndTime);
                const title = encodeURIComponent(event.EventName);
                return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}`;
            } catch (e) {
                console.error("Error formatting date", e);
                return "#";
            }
        };

        const renderEventCard = (event) => {
            const card = document.createElement('div');
            card.className = 'flex w-full message-enter justify-start mt-2 mb-4';
            
            const startDate = new Date(event.StartTime);
            const endDate = new Date(event.EndTime);
            
            const timeString = `${startDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${endDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            const dateString = startDate.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
            const calUrl = createGoogleCalendarLink(event);

            card.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[75%] bg-blue-50 border border-blue-100 rounded-2xl p-4 shadow-sm w-full">
                    <div class="flex items-start space-x-3">
                        <div class="bg-blue-100 text-blue-600 p-2 rounded-lg mt-1">
                            <i class="fa-regular fa-calendar-plus text-xl"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-900">${event.EventName}</h4>
                            <p class="text-sm text-gray-600 mt-0.5"><i class="fa-regular fa-clock mr-1"></i> ${dateString}, ${timeString}</p>
                            <a href="${calUrl}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-block bg-white text-blue-600 border border-blue-200 text-sm font-semibold px-4 py-2 rounded-lg shadow-sm hover:bg-blue-50 transition-colors w-full text-center">
                                Add to Google Calendar
                            </a>
                        </div>
                    </div>
                </div>
            `;
            UI.chatContainer.appendChild(card);
            scrollToBottom();
        };

        const callGeminiAPI = async (userText) => {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                showAlert("Please configure your API key in Settings.");
                toggleSettings(true);
                return;
            }

            // Append user text to local history for context
            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            // Generate System Prompt with current time context for accurate relative scheduling (e.g. "tomorrow at 5")
            const currentDateTime = new Date().toLocaleString();
            const systemPrompt = `You are a helpful, friendly AI personal assistant. The user is logging their day and managing their schedule. 
            The current date and time is: ${currentDateTime}.
            
            INSTRUCTIONS:
            1. Respond conversationally to whatever the user says. Be encouraging and concise.
            2. IF the user mentions an event that should be scheduled, you MUST append a JSON code block at the very end of your response.
            3. The JSON block must use this exact structure containing standard ISO 8601 strings:
            \`\`\`json
            {
              "schedule": [
                {"EventName": "Doctor Appointment", "StartTime": "2026-09-18T14:00:00", "EndTime": "2026-09-18T15:00:00"}
              ]
            }
            \`\`\`
            4. Only include the JSON block if a schedule is detected. Otherwise, just reply normally.`;

            const payload = {
                contents: chatHistory,
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();
                const aiResponseText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiResponseText) {
                    processAIResponse(aiResponseText);
                    // Add AI response to history
                    chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });
                } else {
                    throw new Error("Invalid response structure from API");
                }

            } catch (error) {
                console.error(error);
                showAlert("Failed to connect to AI. Check your API key and connection.");
                removeTypingIndicator();
            }
        };

        const processAIResponse = (rawText) => {
            removeTypingIndicator();

            // Check for JSON block
            const jsonRegex = /```json\n([\s\S]*?)\n```/;
            const match = rawText.match(jsonRegex);
            
            let displayString = rawText;
            let extractedEvents = null;

            if (match && match[1]) {
                // Remove the JSON block from the chat output
                displayString = rawText.replace(jsonRegex, '').trim();
                try {
                    const parsed = JSON.parse(match[1]);
                    if (parsed.schedule && Array.isArray(parsed.schedule)) {
                        extractedEvents = parsed.schedule;
                    }
                } catch (e) {
                    console.error("Failed to parse extracted JSON", e);
                }
            }

            // Render conversational text
            if (displayString) {
                addMessageToUI(displayString, false);
            }

            // Render event cards if detected
            if (extractedEvents) {
                extractedEvents.forEach(event => renderEventCard(event));
            }
        };

        UI.chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = UI.messageInput.value.trim();
            if (!text) return;

            // Clear input and reset height
            UI.messageInput.value = '';
            UI.messageInput.style.height = 'auto';

            // Add user message
            addMessageToUI(text, true);
            
            // Show typing and call API
            addTypingIndicator();
            callGeminiAPI(text);
        });

        // Prompt for setup on first load if no key
        window.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('gemini_api_key')) {
                setTimeout(() => {
                    showAlert("Tap the gear icon to set your AI API key.", 5000);
                }, 1000);
            }
        });
    </script>
</body>
</html>
